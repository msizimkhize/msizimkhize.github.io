name: Auto-Generate Sitemap

on:
  push:
    branches: [ main, master ]  # Triggers whenever you push to your default branch

permissions:
  contents: write  # Grants the workflow permission to commit changes back to your repo

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run sitemap generator script
        run: python generate_sitemap.py

      - name: Commit and push updated sitemap
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-generate sitemap.xml [skip ci]"
          file_pattern: "sitemap.xml"
